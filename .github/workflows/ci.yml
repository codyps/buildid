name: ci
on:
  push:
    branches: 
      - "master"
    tags:
      - "*"
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust_version: [beta]
    env:
      BUILD_ID_LEN: 20
      RUST_LOG: debug 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust_version }}
          components: clippy

      - run: cargo install cargo-hack

      - name: Clippy
        run: cargo hack --feature-powerset clippy -- -D warnings

      - name: Build
        # NOTE: we don't feature-powerset here because we need to provide
        # symbols for some of the specific lookup mechanisms
        # NOTE: we don't build the entire workspace because
        # buildid-linker-symbols does not work on all platforms (for example,
        # it fails on macos)
        run: cargo build --all-targets

      - name: Test
        run: cargo test --all-targets

  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: beta
          components: rustfmt, clippy

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all --all-targets -- -D warnings

  wasm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: beta
          target: wasm32-unknown-unknown,wasm32-wasip1,wasm32-wasip2

      - name: Install component test tools
        shell: bash
        run: |
          set -euo pipefail
          component_tools="$RUNNER_TEMP/buildid-component-tools"
          mkdir -p "$component_tools"
          cd "$component_tools"
          curl -fLsS --retry 3 -O https://github.com/bytecodealliance/wasmtime/releases/download/v50.0.0/wasmtime-v50.0.0-x86_64-linux.tar.xz
          curl -fLsS --retry 3 -O https://github.com/bytecodealliance/wasm-tools/releases/download/v1.262.0/wasm-tools-1.262.0-x86_64-linux.tar.gz
          curl -fLsS --retry 3 -O https://github.com/bytecodealliance/wasmtime/releases/download/v50.0.0/wasi_snapshot_preview1.command.wasm
          echo '77c19ee0437991f9ac7837b9c269d9c7076744f85dad263fea5214cc2723c7ff  wasmtime-v50.0.0-x86_64-linux.tar.xz' | sha256sum --check
          echo '655b8df67d54c3ef9b52fc237c4e94bbfbb5f5f43825245cb0940a7002a9ed65  wasm-tools-1.262.0-x86_64-linux.tar.gz' | sha256sum --check
          echo 'b3de00ac47528237211c6404b4a7e4235a67878665dc3e8853071908c3127a85  wasi_snapshot_preview1.command.wasm' | sha256sum --check
          tar -xf wasmtime-v50.0.0-x86_64-linux.tar.xz --strip-components=1
          tar -xf wasm-tools-1.262.0-x86_64-linux.tar.gz --strip-components=1
          echo "$component_tools" >> "$GITHUB_PATH"
          echo "WASI_ADAPTER=$component_tools/wasi_snapshot_preview1.command.wasm" >> "$GITHUB_ENV"

      - name: Test stamper parser and ID scopes
        run: cargo test -p buildid-wasm-stamp --all-targets --locked

      - name: Test stamped WebAssembly build ID
        run: ./scripts/test-wasm

      - name: Execute stamped components
        run: ./scripts/test-wasm-components

  test-specific:
    env:
      RUST_LOG: debug
    strategy:
      matrix:
        os: [ubuntu-latest]
        rust_version: [beta]
        script: [test-gnu-ld, test-gnu-ld-symbol-start-end]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust_version }}

      - run: ./scripts/${{ matrix.script }}

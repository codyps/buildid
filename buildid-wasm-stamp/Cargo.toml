[package]
name = "buildid-wasm-stamp"
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
license = "MPL-2.0"
description = "Stamp WebAssembly binaries for guest and host build-ID lookup"
repository = "https://github.com/jmesmon/buildid"
readme = "README.md"

[dependencies]
buildid = { version = "1.1", path = ".." }
sha2 = { version = "=0.10.8", default-features = false }
tempfile = "3"
wasmparser = { version = "0.240", default-features = false, features = ["component-model"] }
